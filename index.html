4F \u0432\u043A\u0443\u0441\u0430, \u0437\u0430 \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u044E.","\u0412\u0435\u0447\u0435\u0440\u043E\u043C \u043F\u0435\u0440\u0435\u0447\u0438\u0442\u0430\u0439 \u0437\u0430\u043F\u0438\u0441\u0438 \u0437\u0430 \u044D\u0442\u0438 \u0434\u043D\u0438. \u0415\u0441\u0442\u044C \u043B\u0438 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u044E\u0449\u0438\u0435\u0441\u044F \u0441\u0438\u0442\u0443\u0430\u0446\u0438\u0438?","\u0418\u0442\u043E\u0433 \u043D\u0435\u0434\u0435\u043B\u0438: \u0437\u0430\u0433\u043B\u044F\u043D\u0438 \u0432 \xAB\u0427\u0442\u043E \u044F \u0437\u0430\u043C\u0435\u0447\u0430\u044E\xBB \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB30 \u0434\u043D\u0435\u0439\xBB. \u0427\u0442\u043E \u043E\u0442\u043A\u043B\u0438\u043A\u0430\u0435\u0442\u0441\u044F?","\u041A\u043E\u0433\u0434\u0430 \u043F\u043E\u0442\u044F\u043D\u0435\u0442 \u043A \u0435\u0434\u0435, \u043D\u0430\u0436\u043C\u0438 \xAB\u041F\u0430\u0443\u0437\u0430\xBB \u0438 \u043F\u043E\u043F\u0440\u043E\u0431\u0443\u0439 \u043F\u0440\u0430\u043A\u0442\u0438\u043A\u0443 HALT.","\u041F\u043E\u043F\u0440\u043E\u0431\u0443\u0439 \u043F\u0440\u0430\u043A\u0442\u0438\u043A\u0443 \xAB\u0412\u043E\u043B\u043D\u0430 \u0442\u044F\u0433\u0438\xBB, \u0434\u0430\u0436\u0435 \u0435\u0441\u043B\u0438 \u043F\u043E\u0442\u043E\u043C \u0440\u0435\u0448\u0438\u0448\u044C \u043F\u043E\u0435\u0441\u0442\u044C.","\u0415\u0441\u043B\u0438 \u043F\u0440\u043E\u0431\u0443\u0435\u0448\u044C \u0435\u0434\u0443 \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0433\u043E\u0442\u043E\u0432\u043A\u0438 \u2014 \u0434\u0435\u043B\u0430\u0439 \u044D\u0442\u043E \u043E\u0441\u043E\u0437\u043D\u0430\u043D\u043D\u043E: \u043E\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0441\u044C, \u043F\u043E\u0447\u0443\u0432\u0441\u0442\u0432\u0443\u0439 \u0432\u043A\u0443\u0441, \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0430\u0439.","\u041E\u0442\u043C\u0435\u0447\u0430\u0439 \u0441\u0438\u043B\u0443 \u043F\u0438\u0442\u0430\u043D\u0438\u0438 \u2014 \u0432\u0430\u0436\u043D\u0443\u044E \u0440\u043E\u043B\u044C \u0438\u0433\u0440\u0430\u0435\u0442 \u0441\u043D\u044F\u0442\u0438\u0435 \u0436\u0451\u0441\u0442\u043A\u0438\u0445 \u0437\u0430\u043F\u0440\u0435\u0442\u043E\u0432. \u041A\u043E\u0433\u0434\u0430 \u0435\u0434\u0435 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u044E\u0442 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435, \u0443 \u043D\u0435\u0451 \u043F\u0440\u043E\u043F\u0430\u0434\u0430\u0435\u0442 \u044D\u0444\u0444\u0435\u043A\u0442 \u0437\u0430\u043F\u0440\u0435\u0442\u043D\u043E\u0433\u043E \u043F\u043B\u043E\u0434\u0430.","\u0420\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u043D\u0435 \u0437\u043D\u0430\u0447\u0438\u0442 \xAB\u0435\u0441\u0442\u044C \u0432\u0441\u0451 \u0438 \u0432\u0441\u0435\u0433\u0434\u0430\xBB. \u041E\u043D\u043E \u0443\u0431\u0438\u0440\u0430\u0435\u0442 \u0433\u043E\u043D\u043A\u0443 \xAB\u0441\u044A\u0435\u0441\u0442\u044C, \u043F\u043E\u043A\u0430 \u043C\u043E\u0436\u043D\u043E\xBB, \u0438 \u0432\u044B\u0431\u043E\u0440 \u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0441\u044F \u0441\u043F\u043E\u043A\u043E\u0439\u043D\u0435\u0435."]},{id:"hunger",title:"\u0424\u0438\u0437\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0438 \u044D\u043C\u043E\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0439 \u0433\u043E\u043B\u043E\u0434",body:["\u0424\u0438\u0437\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0433\u043E\u043B\u043E\u0434 \u043E\u0431\u044B\u0447\u043D\u043E \u043D\u0430\u0440\u0430\u0441\u0442\u0430\u0435\u0442 \u043F\u043E\u0441\u0442\u0435\u043F\u0435\u043D\u043D\u043E. \u041F\u043E\u0434\u0445\u043E\u0434\u0438\u0442 \u0440\u0430\u0437\u043D\u0430\u044F \u0435\u0434\u0430, \u0435\u0441\u0442\u044C \u0441\u0438\u0433\u043D\u0430\u043B\u044B \u0442\u0435\u043B\u0430, \u0430 \u043F\u043E\u0441\u043B\u0435 \u0435\u0434\u044B \u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0441\u044F \u0441\u043F\u043E\u043A\u043E\u0439\u043D\u0435\u0435.","\u042D\u043C\u043E\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0439 \u0433\u043E\u043B\u043E\u0434 \u0447\u0430\u0449\u0435 \u043F\u0440\u0438\u0445\u043E\u0434\u0438\u0442 \u0432\u043D\u0435\u0437\u0430\u043F\u043D\u043E, \u0445\u043E\u0447\u0435\u0442\u0441\u044F \u0447\u0435\u0433\u043E-\u0442\u043E \u043A\u043E\u043D\u043A\u0440\u0435\u0442\u043D\u043E\u0433\u043E, \u043E\u043D \u0436\u0438\u0432\u0451\u0442 \u0441\u043A\u043E\u0440\u0435\u0435 \u0432 \u0433\u043E\u043B\u043E\u0432\u0435 \u0438 \u043D\u0435 \u0443\u0442\u0438\u0445\u0430\u0435\u0442 \u043F\u043E\u0441\u043B\u0435 \u0435\u0434\u044B. \u041D\u0435\u0440\u0435\u0434\u043A\u043E \u043F\u043E\u0441\u043B\u0435 \u043D\u0435\u0433\u043E \u043E\u0441\u0442\u0430\u0451\u0442\u0441\u044F \u0432\u0438\u043D\u0430.","\u041E\u0431\u0430 \u0433\u043E\u043B\u043E\u0434\u0430 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0435. \u042D\u043C\u043E\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0439 \u0433\u043E\u0432\u043E\u0440\u0438\u0442 \u043E \u043F\u043E\u0442\u0440\u0435\u0431\u043D\u043E\u0441\u0442\u0438 \u2014 \u0432 \u043E\u0442\u0434\u044B\u0445\u0435, \u0443\u0442\u0435\u0448\u0435\u043D\u0438\u0438, \u0440\u0430\u0434\u043E\u0441\u0442\u0438, \u2014 \u043A\u043E\u0442\u043E\u0440\u0443\u044E \u0435\u0434\u0430 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u043B\u0438\u0448\u044C \u043D\u0435\u043D\u0430\u0434\u043E\u043B\u0433\u043E. \u0420\u0430\u0437\u043B\u0438\u0447\u0430\u0442\u044C \u0438\u0445 \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u043B\u044E\u0431\u043E\u043F\u044B\u0442\u0441\u0442\u0432\u043E, \u0430 \u043D\u0435 \u0441\u0442\u0440\u043E\u0433\u043E\u0441\u0442\u044C."]},{id:"scale",title:"\u0428\u043A\u0430\u043B\u0430 \u0433\u043E\u043B\u043E\u0434\u0430: \u043A\u0430\u043A \u0435\u0439 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\u0441\u044F",body:["\u0428\u043A\u0430\u043B\u0430 \u043E\u0442 1 \u0434\u043E 9 \u2014 \u0441\u043F\u043E\u0441\u043E\u0431 \u0443\u0441\u043B\u044B\u0448\u0430\u0442\u044C \u0442\u0435\u043B\u043E: \u043D\u0430\u0441\u043A\u043E\u043B\u044C\u043A\u043E \u044F \u0433\u043E\u043B\u043E\u0434\u043D\u0430 \u043F\u0435\u0440\u0435\u0434 \u0435\u0434\u043E\u0439 \u0438 \u043A\u0430\u043A \u0441\u0435\u0431\u044F \u0447\u0443\u0432\u0441\u0442\u0432\u0443\u044E \u043F\u043E\u0441\u043B\u0435.","\u042D\u0442\u043E \u043D\u0435 \u0434\u0438\u0435\u0442\u0430 \u0438 \u043D\u0435 \u043F\u0440\u0430\u0432\u0438\u043B\u043E. \u0415\u0441\u0442\u044C \u043C\u043E\u0436\u043D\u043E \u043F\u0440\u0438 \u043B\u044E\u0431\u043E\u0439 \u0446\u0438\u0444\u0440\u0435: \u0434\u043B\u044F \u0443\u0434\u043E\u0432\u043E\u043B\u044C\u0441\u0442\u0432\u0438\u044F, \u0437\u0430 \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u044E, \u0438\u0437 \u0437\u0430\u0431\u043E\u0442\u044B \u043E \u0441\u0435\u0431\u0435. \xAB\u041F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u044B\u0445\xBB \u0437\u043E\u043D \u0437\u0434\u0435\u0441\u044C \u043D\u0435\u0442.","\u041E\u0442\u043C\u0435\u0442\u043A\u0430 \xAB\u043F\u0435\u0440\u0435\u0435\u043B\u0430\xBB \u2014 \u044D\u0442\u043E \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044F, \u0430 \u043D\u0435 \u043F\u0440\u043E\u0432\u0430\u043B. \u0415\u0441\u043B\u0438 \u0448\u043A\u0430\u043B\u0430 \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442 \u0432\u044B\u0437\u044B\u0432\u0430\u0442\u044C \u0442\u0440\u0435\u0432\u043E\u0433\u0443 \u0438\u043B\u0438 \u0436\u0435\u043B\u0430\u043D\u0438\u0435 \u0441\u0435\u0431\u044F \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u0438\u0440\u043E\u0432\u0430\u0442\u044C, \u0435\u0451 \u043C\u043E\u0436\u043D\u043E \u0432\u044B\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB\u041E\u043F\u043E\u0440\u044B\xBB."]},{id:"plate",title:"\xAB\u0414\u043E\u0435\u0434\u0430\u0439, \u043D\u0435\u043B\u044C\u0437\u044F \u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0442\u044C\xBB",body:["\u041C\u043D\u043E\u0433\u0438\u0435 \u0432\u044B\u0440\u043E\u0441\u043B\u0438 \u0441 \u043F\u0440\u0430\u0432\u0438\u043B\u0430\u043C\u0438 \u0432\u0440\u043E\u0434\u0435 \xAB\u043F\u043E\u043A\u0430 \u043D\u0435 \u0441\u044A\u0435\u0448\u044C \u2014 \u0438\u0437-\u0437\u0430 \u0441\u0442\u043E\u043B\u0430 \u043D\u0435 \u0432\u044B\u0439\u0434\u0435\u0448\u044C\xBB \u0438\u043B\u0438 \xAB\u043D\u0435 \u043E\u0431\u0438\u0436\u0430\u0439, \u0434\u043B\u044F \u0442\u0435\u0431\u044F \u0441\u0442\u0430\u0440\u0430\u043B\u0438\u0441\u044C\xBB. \u0422\u0430\u043A\u0438\u0435 \u043F\u0440\u0430\u0432\u0438\u043B\u0430 \u0443\u0447\u0430\u0442 \u043E\u0440\u0438\u0435\u043D\u0442\u0438\u0440\u043E\u0432\u0430\u0442\u044C\u0441\u044F \u043D\u0430 \u0442\u0430\u0440\u0435\u043B\u043A\u0443, \u0430 \u043D\u0435 \u043D\u0430 \u043E\u0449\u0443\u0449\u0435\u043D\u0438\u044F.","\u0412\u043E \u0432\u0437\u0440\u043E\u0441\u043B\u043E\u0439 \u0436\u0438\u0437\u043D\u0438 \u0438\u0445 \u043C\u043E\u0436\u043D\u043E \u043F\u0435\u0440\u0435\u0441\u043C\u043E\u0442\u0440\u0435\u0442\u044C. \u041D\u0435 \u0434\u043E\u0435\u0434\u0430\u0442\u044C \u2014 \u043D\u043E\u0440\u043C\u0430\u043B\u044C\u043D\u043E. \u0412\u0437\u044F\u0442\u044C \u0434\u043E\u0431\u0430\u0432\u043A\u0443, \u0435\u0441\u043B\u0438 \u0445\u043E\u0447\u0435\u0442\u0441\u044F, \u2014 \u0442\u043E\u0436\u0435 \u043D\u043E\u0440\u043C\u0430\u043B\u044C\u043D\u043E. \u041E\u0441\u0442\u0430\u0442\u043A\u0438 \u043C\u043E\u0436\u043D\u043E \u0443\u0431\u0440\u0430\u0442\u044C \u043D\u0430 \u043F\u043E\u0442\u043E\u043C.","\u041F\u0440\u0435\u043A\u0440\u0430\u0442\u0438\u0442\u044C \u0435\u0441\u0442\u044C \u043C\u043E\u0436\u043D\u043E \u0432 \u043B\u044E\u0431\u043E\u0439 \u043C\u043E\u043C\u0435\u043D\u0442, \u043A\u043E\u0433\u0434\u0430 \u043F\u043E\u0447\u0443\u0432\u0441\u0442\u0432\u0443\u0435\u0448\u044C, \u0447\u0442\u043E \u0434\u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E."]},{id:"habit",title:"\u041A\u0430\u043A \u0443\u0441\u0442\u0440\u043E\u0435\u043D\u0430 \u043F\u0440\u0438\u0432\u044B\u0447\u043A\u0430",body:["\u041F\u0440\u0438\u0432\u044B\u0447\u043A\u0443 \u043C\u043E\u0436\u043D\u043E \u043E\u043F\u0438\u0441\u0430\u0442\u044C \u043F\u0435\u0442\u043B\u0451\u0439: \u0442\u0440\u0438\u0433\u0433\u0435\u0440, \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435, \u043D\u0430\u0433\u0440\u0430\u0434\u0430. \u041D\u0430\u043F\u0440\u0438\u043C\u0435\u0440: \u0433\u043E\u0442\u043E\u0432\u043B\u044E \u2014 \u043F\u0440\u043E\u0431\u0443\u044E \u043A\u0443\u0441\u043E\u0447\u0435\u043A \u2014 \u043A\u043E\u0440\u043E\u0442\u043A\u043E\u0435 \u0443\u0434\u043E\u0432\u043E\u043B\u044C\u0441\u0442\u0432\u0438\u0435 \u0438\u043B\u0438 \u0440\u0430\u0437\u0440\u044F\u0434\u043A\u0430. \u041C\u043E\u0437\u0433 \u0437\u0430\u043F\u043E\u043C\u0438\u043D\u0430\u0435\u0442 \u0438 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0435\u0442.","\u041F\u0441\u0438\u0445\u0438\u0430\u0442\u0440 \u0414\u0436\u0430\u0434\u0441\u043E\u043D \u0411\u0440\u044E\u044D\u0440, \u0438\u0437\u0443\u0447\u0430\u044E\u0449\u0438\u0439 \u043F\u0440\u0438\u0432\u044B\u0447\u043A\u0438 \u0438 \u0442\u044F\u0433\u0443, \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0435\u0442 \u043F\u0435\u0440\u0435\u0443\u0447\u0438\u0432\u0430\u0442\u044C \u043F\u0435\u0442\u043B\u044E \u043D\u0435 \u0441\u0438\u043B\u043E\u0439 \u0432\u043E\u043B\u0438, \u0430 \u043B\u044E\u0431\u043E\u043F\u044B\u0442\u0441\u0442\u0432\u043E\u043C: \u0437\u0430\u043C\u0435\u0442\u0438\u0442\u044C, \u043A\u0430\u043A\u0430\u044F \u043D\u0430\u0433\u0440\u0430\u0434\u0430 \u043D\u0430 \u0441\u0430\u043C\u043E\u043C \u0434\u0435\u043B\u0435 \u043F\u0440\u0438\u0445\u043E\u0434\u0438\u0442 \u0438 \u043D\u0430\u0434\u043E\u043B\u0433\u043E \u043B\u0438 \u0435\u0451 \u0445\u0432\u0430\u0442\u0430\u0435\u0442.","\u0427\u0435\u043C \u0447\u0430\u0449\u0435 \u0442\u044B \u0437\u0430\u043C\u0435\u0447\u0430\u0435\u0448\u044C \u043F\u0435\u0442\u043B\u044E, \u0442\u0435\u043C \u043C\u0435\u043D\u044C\u0448\u0435 \u0432 \u043D\u0435\u0439 \u0430\u0432\u0442\u043E\u043F\u0438\u043B\u043E\u0442\u0430. \u041A\u0430\u0436\u0434\u0430\u044F \u0437\u0430\u043F\u0438\u0441\u044C \u0432 \u0434\u043D\u0435\u0432\u043D\u0438\u043A\u0435 \u2014 \u0442\u0430\u043A\u043E\u0435 \u0437\u0430\u043C\u0435\u0447\u0430\u043D\u0438\u0435."]},{id:"cook",title:"\u041F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0433\u043E\u0442\u043E\u0432\u043A\u0438",body:["\u041F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u2014 \u0447\u0430\u0441\u0442\u044C \u0433\u043E\u0442\u043E\u0432\u043A\u0438, \u0430 \u043D\u0435 \u043D\u0430\u0440\u0443\u0448\u0435\u043D\u0438\u0435. \u0410\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043F\u043E\u0434\u044A\u0435\u0434\u0430\u043D\u0438\u0435 \u043E\u0431\u044B\u0447\u043D\u043E \u0443\u0441\u0438\u043B\u0438\u0432\u0430\u044E\u0442 \u0441\u0438\u043B\u044C\u043D\u044B\u0439 \u0433\u043E\u043B\u043E\u0434, \u0441\u043A\u0443\u043A\u0430 \u0438 \u0442\u043E, \u0447\u0442\u043E \u0435\u0434\u0430 \u0432\u0441\u0451 \u0432\u0440\u0435\u043C\u044F \u043F\u043E\u0434 \u0440\u0443\u043A\u043E\u0439.","\u041C\u044F\u0433\u043A\u0438\u0435 \u0438\u0434\u0435\u0438: \u043F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u043E\u0441\u043E\u0437\u043D\u0430\u043D\u043D\u043E, \u0441 \u043B\u043E\u0436\u043A\u0438, \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u044F\u0441\u044C \u043D\u0430 \u0432\u043A\u0443\u0441\u0435; \u0432\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u043F\u043E\u0434\u043A\u0430\u0441\u0442 \u0438\u043B\u0438 \u043C\u0443\u0437\u044B\u043A\u0443; \u043A\u043E\u0433\u0434\u0430 \u0431\u043B\u044E\u0434\u043E \u0433\u043E\u0442\u043E\u0432\u043E \u2014 \u0441\u0435\u0441\u0442\u044C \u0438 \u0 \u043D\u0438\u044F",body:["\u0414\u043E\u043B\u0433\u0438\u0435 \u043F\u0435\u0440\u0435\u0440\u044B\u0432\u044B \u0438 \u043F\u0440\u043E\u043F\u0443\u0441\u043A\u0438 \u043F\u0440\u0438\u0451\u043C\u043E\u0432 \u043F\u0438\u0449\u0438 \u043D\u0435\u0440\u0435\u0434\u043A\u043E \u043E\u0431\u043E\u0440\u0430\u0447\u0438\u0432\u0430\u044E\u0442\u0441\u044F \u0441\u0438\u043B\u044C\u043D\u044B\u043C \u0433\u043E\u043B\u043E\u0434\u043E\u043C \u0438 \u0442\u044F\u0433\u043E\u0439 \u043F\u043E\u0437\u0436\u0435.","\u0412 \u043A\u043E\u0433\u043D\u0438\u0442\u0438\u0432\u043D\u043E-\u043F\u043E\u0432\u0435\u0434\u0435\u043D\u0447\u0435\u0441\u043A\u043E\u0439 \u0442\u0435\u0440\u0430\u043F\u0438\u0438 \u043F\u0438\u0449\u0435\u0432\u043E\u0433\u043E \u043F\u043E\u0432\u0435\u0434\u0435\u043D\u0438\u044F \u0432\u0430\u0436\u043D\u0430 \u0440\u0435\u0433\u0443\u043B\u044F\u0440\u043D\u043E\u0441\u0442\u044C: \u043A\u043E\u0433\u0434\u0430 \u0442\u0435\u043B\u043E \u0437\u043D\u0430\u0435\u0442, \u0447\u0442\u043E \u0435\u0434\u0430 \u0431\u0443\u0434\u0435\u0442, \u0435\u043C\u0443 \u043D\u0435 \u043D\u0443\u0436\u043D\u043E \xAB\u0437\u0430\u043F\u0430\u0441\u0430\u0442\u044C\u0441\u044F\xBB.","\u0417\u0434\u0435\u0441\u044C \u043D\u0435 \u043D\u0443\u0436\u043D\u044B \u0442\u043E\u0447\u043D\u044B\u0435 \u0447\u0430\u0441\u044B \u0438 \u0433\u0440\u0430\u043C\u043C\u044B. \u0414\u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E \u0437\u0430\u0431\u043E\u0442\u0438\u0442\u044C\u0441\u044F \u043E \u0442\u043E\u043C, \u0447\u0442\u043E\u0431\u044B \u043D\u0435 \u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0442\u044C \u0441\u0435\u0431\u044F \u043D\u0430\u0434\u043E\u043B\u0433\u043E \u0431\u0435\u0437 \u0435\u0434\u044B."]},{id:"kind",title:"\u0421\u0430\u043C\u043E\u043A\u0440\u0438\u0442\u0438\u043A\u0430 \u0438 \u0434\u043E\u0431\u0440\u043E\u0442\u0430 \u043A \u0441\u0435\u0431\u0435",body:["\u041A\u0430\u0436\u0435\u0442\u0441\u044F, \u0447\u0442\u043E \u0441\u0442\u0440\u043E\u0433\u043E\u0441\u0442\u044C \u043A \u0441\u0435\u0431\u0435 \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u0434\u0435\u0440\u0436\u0430\u0442\u044C\u0441\u044F. \u0418\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u044F \u0441\u0430\u043C\u043E\u0441\u043E\u0441\u0442\u0440\u0430\u0434\u0430\u043D\u0438\u044F, \u0432 \u0442\u043E\u043C \u0447\u0438\u0441\u043B\u0435 \u0440\u0430\u0431\u043E\u0442\u044B \u041A\u0440\u0438\u0441\u0442\u0438\u043D \u041D\u0435\u0444\u0444, \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442 \u043E\u0431\u0440\u0430\u0442\u043D\u043E\u0435: \u0441\u0430\u043C\u043E\u043A\u0440\u0438\u0442\u0438\u043A\u0430 \u043F\u043E\u0441\u043B\u0435 \xAB\u043D\u0430\u0440\u0443\u0448\u0435\u043D\u0438\u044F\xBB \u0447\u0430\u0449\u0435 \u043F\u043E\u0434\u043F\u0438\u0442\u044B\u0432\u0430\u0435\u0442 \u043F\u0435\u0440\u0435\u0435\u0434\u0430\u043D\u0438\u0435, \u0430 \u0434\u043E\u0431\u0440\u043E\u0442\u0430 \u043A \u0441\u0435\u0431\u0435 \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u0432\u044B\u0439\u0442\u0438 \u0438\u0437 \u043A\u0440\u0443\u0433\u0430.","\u0414\u043E\u0431\u0440\u043E\u0442\u0430 \u2014 \u043D\u0435 \u0432\u0441\u0435\u0434\u043E\u0437\u0432\u043E\u043B\u0435\u043D\u043D\u043E\u0441\u0442\u044C. \u042D\u0442\u043E \u043F\u0440\u0438\u0437\u043D\u0430\u043D\u0438\u0435: \xAB\u043C\u043D\u0435 \u0441\u0435\u0439\u0447\u0430\u0441 \u0442\u0440\u0443\u0434\u043D\u043E, \u0438 \u044D\u0442\u043E \u043F\u043E-\u0447\u0435\u043B\u043E\u0432\u0435\u0447\u0435\u0441\u043A\u0438 \u043F\u043E\u043D\u044F\u0442\u043D\u043E\xBB.","\u041F\u0440\u043E\u0441\u0442\u043E\u0439 \u0432\u043E\u043F\u0440\u043E\u0441: \u0447\u0442\u043E \u0431\u044B \u044F \u0441\u043A\u0430\u0437\u0430\u043B\u0430 \u0431\u043B\u0438\u0437\u043A\u043E\u0439 \u043F\u043E\u0434\u0440\u0443\u0433\u0435 \u0432 \u0442\u0430\u043A\u043E\u0439 \u0436\u0435 \u0441\u0438\u0442\u0443\u0430\u0446\u0438\u0438?"]},{id:"wave",title:"\u0412\u043E\u043B\u043D\u0430 \u0442\u044F\u0433\u0438",body:["\u041F\u0440\u0430\u043A\u0442\u0438\u043A\u0430 urge surfing \u043F\u0440\u0438\u0448\u043B\u0430 \u0438\u0437 \u0434\u0438\u0430\u043B\u0435\u043A\u0442\u0438\u043A\u043E-\u043F\u043E\u0432\u0435\u0434\u0435\u043D\u0447\u0435\u0441\u043A\u043E\u0439 \u0442\u0435\u0440\u0430\u043F\u0438\u0438. \u0422\u044F\u0433\u0430 \u0432 \u043D\u0435\u0439 \u2014 \u0432\u043E\u043B\u043D\u0430: \u043E\u043D\u0430 \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442\u0441\u044F, \u0434\u043E\u0445\u043E\u0434\u0438\u0442 \u0434\u043E \u043F\u0438\u043A\u0430 \u0438 \u0441\u043F\u0430\u0434\u0430\u0435\u0442, \u0434\u0430\u0436\u0435 \u0435\u0441\u043B\u0438 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0434\u0435\u043B\u0430\u0442\u044C.","\u0417\u0430\u0434\u0430\u0447\u0430 \u043D\u0435 \u0431\u043E\u0440\u043E\u0442\u044C\u0441\u044F \u0438 \u043D\u0435 \u043F\u043E\u0434\u0434\u0430\u0432\u0430\u0442\u044C\u0441\u044F, \u0430 \u043D\u0430\u0431\u043B\u044E\u0434\u0430\u0442\u044C \u043E\u0449\u0443\u0449\u0435\u043D\u0438\u044F \u0432 \u0442\u0435\u043B\u0435, \u043F\u043E\u043A\u0430 \u0432\u043E\u043B\u043D\u0430 \u043C\u0435\u043D\u044F\u0435\u0442\u0441\u044F.","\u041F\u043E\u043F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u043C\u043E\u0436\u043D\u043E \u0432 \xAB\u041F\u0430\u0443\u0437\u0435\xBB \u2014 \u0442\u0430\u043C \u0435\u0441\u0442\u044C \u0442\u0430\u0439\u043C\u0435\u0440."]},{id:"halt",title:"HALT: \u0447\u0435\u0442\u044B\u0440\u0435 \u0441\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u044F",body:["HALT \u2014 \u0441\u043E\u043A\u0440\u0430\u0449\u0435\u043D\u0438\u0435 \u043E\u0442 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u0438\u0445 \u0441\u043B\u043E\u0432: \u0433\u043E\u043B\u043E\u0434\u043D\u0430, \u0437\u043B\u044E\u0441\u044C, \u043E\u0434\u0438\u043D\u043E\u043A\u043E, \u0443\u0441\u0442\u0430\u043B\u0430. \u042D\u0442\u0438 \u0441\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u044F \u043B\u0435\u0433\u043A\u043E \u043F\u0440\u0438\u043D\u044F\u0442\u044C \u0437\u0430 \u0436\u0435\u043B\u0430\u043D\u0438\u0435 \u043F\u043E\u0435\u0441\u0442\u044C.","\u041A\u043E\u0440\u043E\u0442\u043A\u0430\u044F \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430 \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u043F\u043E\u043D\u044F\u0442\u044C, \u0447\u0442\u043E \u043D\u0430 \u0441\u0430\u043C\u043E\u043C \u0434\u0435\u043B\u0435 \u043D\u0443\u0436\u043D\u043E: \u043F\u043E\u0435\u0441\u0442\u044C, \u0432\u044B\u0434\u043E\u0445\u043D\u0443\u0442\u044C, \u043F\u043E\u0433\u043E\u0432\u043E\u0440\u0438\u0442\u044C \u0441 \u043A\u0435\u043C-\u0442\u043E \u0438\u043B\u0438 \u043E\u0442\u0434\u043E\u0445\u043D\u0443\u0442\u044C."]},{id:"mindful",title:"\u041E\u0441\u043E\u0437\u043D\u0430\u043D\u043D\u043E\u0435 \u043F\u0438\u0442\u0430\u043D\u0438\u0435 \u2014 \u043D\u0435 \u0438\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435",body:["\u041E\u0441\u043E\u0437\u043D\u0430\u043D\u043D\u043E\u0435 \u043F\u0438\u0442\u0430\u043D\u0438\u0435 \u2014 \u044D\u0442\u043E \u0432\u043D\u0438\u043C\u0430\u043D\u0438\u0435 \u043A \u0432\u043A\u0443\u0441\u0443, \u0442\u0435\u043C\u043F\u0443, \u0433\u043E\u043B\u043E\u0434\u0443 \u0438 \u0441\u044B\u0442\u043E\u0441\u0442\u0438. \u041F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u044B, \u043F\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0435 \u043D\u0430 \u043D\u0451\u043C, \u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440 MB-EAT \u0414\u0436\u0438\u043D \u041A\u0440\u0438\u0441\u0442\u0435\u043B\u043B\u0435\u0440, \u0438\u0437\u0443\u0447\u0430\u043B\u0438\u0441\u044C \u043F\u0440\u0438 \u043A\u043E\u043C\u043F\u0443\u043B\u044C\u0441\u0438\u0432\u043D\u043E\u043C \u043F\u0435\u0440\u0435\u0435\u0434\u0430\u043D\u0438\u0438 \u0438 \u043F\u043E\u043A\u0430\u0437\u0430\u043B\u0438 \u0445\u043E\u0440\u043E\u0448\u0438\u0435 \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u044B.","\u041E\u0441\u0 @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
.ed{--bg:#EDF1EE;--surface:#F8FAF8;--ink:#1E2A2B;--muted:#5A6967;--line:#D2DCD6;--teal:#2E5E5A;--tealSoft:#DCE8E5;--plum:#6E4F74;--plumSoft:#ECE4EE;
font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.ed *{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding:calc(46px + env(safe-area-inset-top)) 18px 24px}
.savepill{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:15;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
.savepill.idle{display:none}
.savepill.error{color:#8A2F3C;border-color:#8A2F3C}
.savepill button{background:none;border:none;color:#8A2F3C;font-family:inherit;font-size:12.5px;font-weight:600;text-decoration:underline;padding:0 0 0 6px;cursor:pointer}
.h1{font-family:'Lora',Georgia,serif;font-weight:600;font-size:34px;line-height:1.15;margin:0}
.h2{font-family:'Lora',Georgia,serif;font-weight:500;font-size:21px;line-height:1.3;margin:0 0 10px}
.muted{color:var(--muted)}
.p{font-size:15px;line-height:1.55;margin:0}
.section{margin-top:30px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.week{border-left:3px solid var(--teal);padding:4px 0 4px 14px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:14px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.plum.on{background:var(--plum);border-color:var(--plum)}
.chip.static{cursor:default}
.ed textarea,.ed input[type=text]{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.lbl{display:block;font-size:14px;font-weight:500;margin:18px 0 8px}
.btn{font-family:inherit;font-size:15px;font-weight:500;border-radius:12px;padding:12px 18px;border:none;cursor:pointer;background:var(--teal);color:#fff}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.link{background:none;color:var(--teal);padding:6px 0;text-decoration:underline}
.btn:disabled{opacity:.45;cursor:default}
.ed button:focus-visible,.ed textarea:focus-visible,.ed input:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:10}
.navb{background:none;border:none;font-family:inherit;font-size:12.5px;color:var(--muted);padding:10px 4px;cursor:pointer;min-width:60px}
.navb.on{color:var(--teal);font-weight:600}
.pausebtn{width:74px;height:74px;flex-shrink:0;border-radius:50%;background:var(--plum);color:#fff;border:5px solid var(--bg);font-family:'Lora',Georgia,serif;font-size:15px;margin-top:-34px;cursor:pointer}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none;padding-top:0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;position:relative}
.cell.has{background:var(--tealSoft);border-color:var(--teal)}
.cell.today{outline:2px solid var(--plum);outline-offset:1px}
.cell:disabled{opacity:.4;cursor:default}
.dot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--plum)}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);line-height:1.35}
.stat b{font-family:'Lora',Georgia,serif;font-size:28px;font-weight:600;display:block;color:var(--ink)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.breath-wrap{display:flex;flex-direction:column;align-items:center;margin:14px 0 4px;height:220px;justify-content:center}
.breath{width:170px;height:170px;border-radius:50%;background:var(--plumSoft);border:2px solid var(--plum);transition-property:transform;transition-timing-function:ease-in-out}
.breath.in{transform:scale(1)}
.breath.out{transform:scale(.6)}
.breath-label{font-family:'Lora',Georgia,serif;font-size:18px;margin-top:8px;color:var(--plum)}
@media (prefers-reduced-motion: reduce){.breath{transition:none}}
.big{font-family:'Lora',Georgia,serif;font-size:56px;font-weight:600;text-align:center;margin:6px 0;color:var(--plum)}
.timer{font-family:'Lora',Georgia,serif;font-size:44px;font-weight:600;text-align:center;color:var(--plum);margin:8px 0}
.ed input[type=range]{width:100%;accent-color:var(--plum)}
.ol{padding-left:20px;margin:0}
.ol li{margin-bottom:10px;line-height:1.5;font-size:15px}
.menuitem{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 10px}
.row{display:flex;gap:8px;align-items:center}
.progress{display:flex;gap:6px;margin-bottom:22px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--plum)}
.notice{background:var(--tealSoft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;margin-top:14px}
.actions{display:flex;gap:10px;margin-top:28px}
.actions .btn{flex:1}
.scale9{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.s9{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;padding:0}
.s9.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt.main{border-color:var(--plum);background:var(--plumSoft)}
.opt b{display:block;font-family:'Lora',Georgia,serif;font-weight:500;font-size:19px;margin-bottom:4px}
.opt span{font-size:14px;color:var(--muted);line-height:1.45}
.cardrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:14px 0;cursor:pointer;font-family:'Lora',Georgia,serif;font-size:18px;color:var(--ink)}
.cardrow:first-child{border-top:none}
.readmark{font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--muted);flex-shrink:0;margin-left:12px}
.article p{font-size:16px;line-height:1.65;margin:0 0 16px;font-family:'Lora',Georgia,serif}
.steps{margin:0;padding-left:20px}
