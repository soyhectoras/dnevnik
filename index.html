u043D\u043E\u043C \u043F\u0438\u0442\u0430\u043D\u0438\u0438 \u2014 \u0432\u0430\u0436\u043D\u0443\u044E \u0440\u043E\u043B\u044C \u0438\u0433\u0440\u0430\u0435\u0442 \u0441\u043D\u044F\u0442\u0438\u0435 \u0436\u0451\u0441\u0442\u043A\u0438\u0445 \u0437\u0430\u043F\u0440\u0435\u0442\u043E\u0432. \u041A\u043E\u0433\u0434\u0430 \u0435\u0434\u0435 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u044E\u0442 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435, \u0443 \u043D\u0435\u0451 \u043F\u0440\u043E\u043F\u0430\u0434\u0430\u0435\u0442 \u044D\u0444\u0444\u0435\u043A\u0442 \u0437\u0430\u043F\u0440\u0435\u0442\u043D\u043E\u0433\u043E \u043F\u043B\u043E\u0434\u0430.","\u0420\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u043D\u0435 \u0437\u043D\u0430\u0447\u0438\u0442 \xAB\u0435\u0441\u0442\u044C \u0432\u0441\u0451 \u0438 \u0432\u0441\u0435\u0433\u0434\u0430\xBB. \u041E\u043D\u043E \u0443\u0431\u0438\u0440\u0430\u0435\u0442 \u0433\u043E\u043D\u043A\u0443 \xAB\u0441\u044A\u0435\u0441\u0442\u044C, \u043F\u043E\u043A\u0430 \u043C\u043E\u0436\u043D\u043E\xBB, \u0438 \u0432\u044B\u0431\u043E\u0440 \u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0441\u044F \u0441\u043F\u043E\u043A\u043E\u0439\u043D\u0435\u0435."]},{id:"hunger",title:"\u0424\u0438\u0437\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0438 \u044D\u043C\u043E\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0439 \u0433\u043E\u043B\u043E\u0434",body:["\u0424\u0438\u0437\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0433\u043E\u043B\u043E\u0434 \u043E\u0431\u044B\u0447\u043D\u043E \u043D\u0430\u0440\u0430\u0441\u0442\u0430\u0435\u0442 \u043F\u043E\u0441\u0442\u0435\u043F\u0435\u043D\u043D\u043E. \u041F\u043E\u0434\u0445\u043E\u0434\u0438\u0442 \u0440\u0430\u0437\u043D\u0430\u044F \u0435\u0434\u0430, \u0435\u0441\u0442\u044C \u0441\u0438\u0433\u043D\u0430\u043B\u044B \u0442\u0435\u043B\u0430, \u0430 \u043F\u043E\u0441\u043B\u0435 \u0435\u0434\u044B \u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0441\u044F \u0441\u043F\u043E\u043A\u043E\u0439\u043D\u0435\u0435.","\u042D\u043C\u043E\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0439 \u0433\u043E\u043B\u043E\u0434 \u0447\u0430\u0449\u0435 \u043F\u0440\u0438\u0445\u043E\u0434\u0438\u0442 \u0432\u043D\u0435\u0437\u0430\u043F\u043D\u043E, \u0445\u043E\u0447\u0435\u0442\u0441\u044F \u0447\u0435\u0433\u043E-\u0442\u043E \u043A\u043E\u043D\u043A\u0440\u0435\u0442\u043D\u043E\u0433\u043E, \u043E\u043D \u0436\u0438\u0432\u0451\u0442 \u0441\u043A\u043E\u0440\u0435\u0435 \u0432 \u0433\u043E\u043B\u043E\u0432\u0435 \u0438 \u043D\u0435 \u0443\u0442\u0438\u0445\u0430\u0435\u0442 \u043F\u043E\u0441\u043B\u0435 \u0435\u0434\u044B. \u041D\u0435\u0440\u0435\u0434\u043A\u043E \u043F\u043E\u0441\u043B\u0435 \u043D\u0435\u0433\u043E \u043E\u0441\u0442\u0430\u0451\u0442\u0441\u044F \u0432\u0438\u043D\u0430.","\u041E\u0431\u0430 \u0433\u043E\u043B\u043E\u0434\u0430 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0435. \u042D\u043C\u043E\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0439 \u0433\u043E\u0432\u043E\u0440\u0438\u0442 \u043E \u043F\u043E\u0442\u0440\u0435\u0431\u043D\u043E\u0441\u0442\u0438 \u2014 \u0432 \u043E\u0442\u0434\u044B\u0445\u0435, \u0443\u0442\u0435\u0448\u0435\u043D\u0438\u0438, \u0440\u0430\u0434\u043E\u0441\u0442\u0438, \u2014 \u043A\u043E\u0442\u043E\u0440\u0443\u044E \u0435\u0434\u0430 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u043B\u0438\u0448\u044C \u043D\u0435\u043D\u0430\u0434\u043E\u043B\u0433\u043E. \u0420\u0430\u0437\u043B\u0438\u0447\u0430\u0442\u044C \u0438\u0445 \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u043B\u044E\u0431\u043E\u043F\u044B\u0442\u0441\u0442\u0432\u043E, \u0430 \u043D\u0435 \u0441\u0442\u0440\u043E\u0433\u043E\u0441\u0442\u044C."]},{id:"scale",title:"\u0428\u043A\u0430\u043B\u0430 \u0433\u043E\u043B\u043E\u0434\u0430: \u043A\u0430\u043A \u0435\u0439 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\u0441\u044F",body:["\u0428\u043A\u0430\u043B\u0430 \u043E\u0442 1 \u0434\u043E 9 \u2014 \u0441\u043F\u043E\u0441\u043E\u0431 \u0443\u0441\u043B\u044B\u0448\u0430\u0442\u044C \u0442\u0435\u043B\u043E: \u043D\u0430\u0441\u043A\u043E\u043B\u044C\u043A\u043E \u044F \u0433\u043E\u043B\u043E\u0434\u043D\u0430 \u043F\u0435\u0440\u0435\u0434 \u0435\u0434\u043E\u0439 \u0438 \u043A\u0430\u043A \u0441\u0435\u0431\u044F \u0447\u0443\u0432\u0441\u0442\u0432\u0443\u044E \u043F\u043E\u0441\u043B\u0435.","\u042D\u0442\u043E \u043D\u0435 \u0434\u0438\u0435\u0442\u0430 \u0438 \u043D\u0435 \u043F\u0440\u0430\u0432\u0438\u043B\u043E. \u0415\u0441\u0442\u044C \u043C\u043E\u0436\u043D\u043E \u043F\u0440\u0438 \u043B\u044E\u0431\u043E\u0439 \u0446\u0438\u0444\u0440\u0435: \u0434\u043B\u044F \u0443\u0434\u043E\u0432\u043E\u043B\u044C\u0441\u0442\u0432\u0438\u044F, \u0437\u0430 \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u044E, \u0438\u0437 \u0437\u0430\u0431\u043E\u0442\u044B \u043E \u0441\u0435\u0431\u0435. \xAB\u041F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u044B\u0445\xBB \u0437\u043E\u043D \u0437\u0434\u0435\u0441\u044C \u043D\u0435\u0442.","\u041E\u0442\u043C\u0435\u0442\u043A\u0430 \xAB\u043F\u0435\u0440\u0435\u0435\u043B\u0430\xBB \u2014 \u044D\u0442\u043E \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044F, \u0430 \u043D\u0435 \u043F\u0440\u043E\u0432\u0430\u043B. \u0415\u0441\u043B\u0438 \u0448\u043A\u0430\u043B\u0430 \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442 \u0432\u044B\u0437\u044B\u0432\u0430\u0442\u044C \u0442\u0440\u0435\u0432\u043E\u0433\u0443 \u0438\u043B\u0438 \u0436\u0435\u043B\u0430\u043D\u0438\u0435 \u0441\u0435\u0431\u044F \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u0438\u0440\u043E\u0432\u0430\u0442\u044C, \u0435\u0451 \u043C\u043E\u0436\u043D\u043E \u0432\u044B\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB\u041E\u043F\u043E\u0440\u044B\xBB."]},{id:"plate",title:"\xAB\u0414\u043E\u0435\u0434\u0430\u0439, \u043D\u0435\u043B\u044C\u0437\u044F \u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0442\u044C\xBB",body:["\u041C\u043D\u043E\u0433\u0438\u0435 \u0432\u044B\u0440\u043E\u0441\u043B\u0438 \u0441 \u043F\u0440\u0430\u0432\u0438\u043B\u0430\u043C\u0438 \u0432\u0440\u043E\u0434\u0435 \xAB\u043F\u043E\u043A\u0430 \u043D\u0435 \u0441\u044A\u0435\u0448\u044C \u2014 \u0438\u0437-\u0437\u0430 \u0441\u0442\u043E\u043B\u0430 \u043D\u0435 \u0432\u044B\u0439\u0434\u0435\u0448\u044C\xBB \u0438\u043B\u0438 \xAB\u043D\u0435 \u043E\u0431\u0438\u0436\u0430\u0439, \u0434\u043B\u044F \u0442\u0435\u0431\u044F \u0441\u0442\u0430\u0440\u0430\u043B\u0438\u0441\u044C\xBB. \u0422\u0430\u043A\u0438\u0435 \u043F\u0440\u0430\u0432\u0438\u043B\u0430 \u0443\u0447\u0430\u0442 \u043E\u0440\u0438\u0435\u043D\u0442\u0438\u0440\u043E\u0432\u0430\u0442\u044C\u0441\u044F \u043D\u0430 \u0442\u0430\u0440\u0435\u043B\u043A\u0443, \u0430 \u043D\u0435 \u043D\u0430 \u043E\u0449\u0443\u0449\u0435\u043D\u0438\u044F.","\u0412\u043E \u0432\u0437\u0440\u043E\u0441\u043B\u043E\u0439 \u0436\u0438\u0437\u043D\u0438 \u0438\u0445 \u043C\u043E\u0436\u043D\u043E \u043F\u0435\u0440\u0435\u0441\u043C\u043E\u0442\u0440\u0435\u0442\u044C. \u041D\u0435 \u0434\u043E\u0435\u0434\u0430\u0442\u044C \u2014 \u043D\u043E\u0440\u043C\u0430\u043B\u044C\u043D\u043E. \u0412\u0437\u044F\u0442\u044C \u0434\u043E\u0431\u0430\u0432\u043A\u0443, \u0435\u0441\u043B\u0438 \u0445\u043E\u0447\u0435\u0442\u0441\u044F, \u2014 \u0442\u043E\u0436\u0435 \u043D\u043E\u0440\u043C\u0430\u043B\u044C\u043D\u043E. \u041E\u0441\u0442\u0430\u0442\u043A\u0438 \u043C\u043E\u0436\u043D\u043E \u0443\u0431\u0440\u0430\u0442\u044C \u043D\u0430 \u043F\u043E\u0442\u043E\u043C.","\u041F\u0440\u0435\u043A\u0440\u0430\u0442\u0438\u0442\u044C \u0435\u0441\u0442\u044C \u043C\u043E\u0436\u043D\u043E \u0432 \u043B\u044E\u0431\u043E\u0439 \u043C\u043E\u043C\u0435\u043D\u0442, \u043A\u043E\u0433\u0434\u0430 \u043F\u043E\u0447\u0443\u0432\u0441\u0442\u0432\u0443\u0435\u0448\u044C, \u0447\u0442\u043E \u0434\u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E."]},{id:"habit",title:"\u041A\u0430\u043A \u0443\u0441\u0442\u0440\u043E\u0435\u043D\u0430 \u043F\u0440\u0438\u0432\u044B\u0447\u043A\u0430",body:["\u041F\u0440\u0438\u0432\u044B\u0447\u043A\u0443 \u043C\u043E\u0436\u043D\u043E \u043E\u043F\u0438\u0441\u0430\u0442\u044C \u043F\u0435\u0442\u043B\u0451\u0439: \u0442\u0440\u0438\u0433\u0433\u0435\u0440, \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435, \u043D\u0430\u0433\u0440\u0430\u0434\u0430. \u041D\u0430\u043F\u0440\u0438\u043C\u0435\u0440: \u0433\u043E\u0442\u043E\u0432\u043B\u044E \u2014 \u043F\u0440\u043E\u0431\u0443\u044E \u043A\u0443\u0441\u043E\u0447\u0435\u043A \u2014 \u043A\u043E\u0440\u043E\u0442\u043A\u043E\u0435 \u0443\u0434\u043E\u0432\u043E\u043B\u044C\u0441\u0442\u0432\u0438\u0435 \u0438\u043B\u0438 \u0440\u0430\u0437\u0440\u044F\u0434\u043A\u0430. \u041C\u043E\u0437\u0433 \u0437\u0430\u043F\u043E\u043C\u0438\u043D\u0430\u0435\u0442 \u0438 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0435\u0442.","\u041F\u0441\u0438\u0445\u0438\u0430\u0442\u0440 \u0414\u0436\u0430\u0434\u0441\u043E\u043D \u0411\u0440\u044E\u044D\u0440, \u0438\u0437\u0443\u0447\u0430\u044E\u0449\u0438\u0439 \u043F\u0440\u0438\u0432\u044B\u0447\u043A\u0438 \u0438 \u0442\u044F\u0433\u0443, \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0435\u0442 \u043F\u0435\u0440\u0435\u0443\u0447\u0438\u0432\u0430\u0442\u044C \u043F\u0435\u0442\u043B\u044E \u043D\u0435 \u0441\u0438\u043B\u043E\u0439 \u0432\u043E\u043B\u0438, \u0430 \u043B\u044E\u0431\u043E\u043F\u044B\u0442\u0441\u0442\u0432\u043E\u043C: \u0437\u0430\u043C\u0435\u0442\u0438\u0442\u044C, \u043A\u0430\u043A\u0430\u044F \u043D\u0430\u0433\u0440\u0430\u0434\u0430 \u043D\u0430 \u0441\u0430\u043C\u043E\u043C \u0434\u0435\u043B\u0435 \u043F\u0440\u0438\u0445\u043E\u0434\u0438\u0442 \u0438 \u043D\u0430\u0434\u043E\u043B\u0433\u043E \u043B\u0438 \u0435\u0451 \u0445\u0432\u0430\u0442\u0430\u0435\u0442.","\u0427\u0435\u043C \u0447\u0430\u0449\u0435 \u0442\u044B \u0437\u0430\u043C\u0435\u0447\u0430\u0435\u0448\u044C \u043F\u0435\u0442\u043B\u044E, \u0442\u0435\u043C \u043C\u0435\u043D\u044C\u0448\u0435 \u0432 \u043D\u0435\u0439 \u0430\u0432\u0442\u043E\u043F\u0438\u043B\u043E\u0442\u0430. \u041A\u0430\u0436\u0434\u0430\u044F \u0437\u0430\u043F\u0438\u0441\u044C \u0432 \u0434\u043D\u0435\u0432\u043D\u0438\u043A\u0435 \u2014 \u0442\u0430\u043A\u043E\u0435 \u0437\u0430\u043C\u0435\u0447\u0430\u043D\u0438\u0435."]},{id:"cook",title:"\u041F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0433\u043E\u0442\u043E\u0432\u043A\u0438",body:["\u041F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u2014 \u0447\u0430\u0441\u0442\u044C \u0433\u043E\u0442\u043E\u0432\u043A\u0438, \u0430 \u043D\u0435 \u043D\u0430\u0440\u0443\u0448\u0435\u043D\u0438\u0435. \u0410\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043F\u043E\u0434\u044A\u0435\u0434\u0430\u043D\u0438\u0435 \u043E\u0431\u044B\u0447\u043D\u043E \u0443\u0441\u0438\u043B\u0438\u0432\u0430\u044E\u0442 \u0441\u0438\u043B\u044C\u043D\u044B\u0439 \u0433\u043E\u043B\u043E\u0434, \u0441\u043A\u0443\u043A\u0430 \u0438 \u0442\u043E, \u0447\u0442\u043E \u0435\u0434\u0430 \u0432\u0441\u0451 \u0432\u0440\u0435\u043C\u044F \u043F\u043E\u0434 \u0440\u0443\u043A\u043E\u0439.","\u041C\u044F\u0433\u043A\u0438\u0435 \u0438\u0434\u0435\u0438: \u043F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u043E\u0441\u043E\u0437\u043D\u0430\u043D\u043D\u043E, \u0441 \u043B\u043E\u0436\u043A\u0438, \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u044F\u0441\u044C \u043D\u0430 \u0432\u043A\u0443\u0441\u0435; \u0432\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u043F\u043E\u0434\u043A\u0430\u0441\u0442 \u0438\u043B\u0438 \u043C\u0443\u0437\u044B\u043A\u0443; \u043A\u043E\u0433\u0434\u0430 \u0431\u043B\u044E\u0434\u043E \u0433\u043E\u0442\u043E\u0432\u043E \u2014 \u0441\u0435\u0441\u044 \u0438\u0441\u0430\u043D\u0438\u044F",body:["\u0414\u043E\u043B\u0433\u0438\u0435 \u043F\u0435\u0440\u0435\u0440\u044B\u0432\u044B \u0438 \u043F\u0440\u043E\u043F\u0443\u0441\u043A\u0438 \u043F\u0440\u0438\u0451\u043C\u043E\u0432 \u043F\u0438\u0449\u0438 \u043D\u0435\u0440\u0435\u0434\u043A\u043E \u043E\u0431\u043E\u0440\u0430\u0447\u0438\u0432\u0430\u044E\u0442\u0441\u044F \u0441\u0438\u043B\u044C\u043D\u044B\u043C \u0433\u043E\u043B\u043E\u0434\u043E\u043C \u0438 \u0442\u044F\u0433\u043E\u0439 \u043F\u043E\u0437\u0436\u0435.","\u0412 \u043A\u043E\u0433\u043D\u0438\u0442\u0438\u0432\u043D\u043E-\u043F\u043E\u0432\u0435\u0434\u0435\u043D\u0447\u0435\u0441\u043A\u043E\u0439 \u0442\u0435\u0440\u0430\u043F\u0438\u0438 \u043F\u0438\u0449\u0435\u0432\u043E\u0433\u043E \u043F\u043E\u0432\u0435\u0434\u0435\u043D\u0438\u044F \u0432\u0430\u0436\u043D\u0430 \u0440\u0435\u0433\u0443\u043B\u044F\u0440\u043D\u043E\u0441\u0442\u044C: \u043A\u043E\u0433\u0434\u0430 \u0442\u0435\u043B\u043E \u0437\u043D\u0430\u0435\u0442, \u0447\u0442\u043E \u0435\u0434\u0430 \u0431\u0443\u0434\u0435\u0442, \u0435\u043C\u0443 \u043D\u0435 \u043D\u0443\u0436\u043D\u043E \xAB\u0437\u0430\u043F\u0430\u0441\u0430\u0442\u044C\u0441\u044F\xBB.","\u0417\u0434\u0435\u0441\u044C \u043D\u0435 \u043D\u0443\u0436\u043D\u044B \u0442\u043E\u0447\u043D\u044B\u0435 \u0447\u0430\u0441\u044B \u0438 \u0433\u0440\u0430\u043C\u043C\u044B. \u0414\u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E \u0437\u0430\u0431\u043E\u0442\u0438\u0442\u044C\u0441\u044F \u043E \u0442\u043E\u043C, \u0447\u0442\u043E\u0431\u044B \u043D\u0435 \u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0442\u044C \u0441\u0435\u0431\u044F \u043D\u0430\u0434\u043E\u043B\u0433\u043E \u0431\u0435\u0437 \u0435\u0434\u044B."]},{id:"kind",title:"\u0421\u0430\u043C\u043E\u043A\u0440\u0438\u0442\u0438\u043A\u0430 \u0438 \u0434\u043E\u0431\u0440\u043E\u0442\u0430 \u043A \u0441\u0435\u0431\u0435",body:["\u041A\u0430\u0436\u0435\u0442\u0441\u044F, \u0447\u0442\u043E \u0441\u0442\u0440\u043E\u0433\u043E\u0441\u0442\u044C \u043A \u0441\u0435\u0431\u0435 \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u0434\u0435\u0440\u0436\u0430\u0442\u044C\u0441\u044F. \u0418\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u044F \u0441\u0430\u043C\u043E\u0441\u043E\u0441\u0442\u0440\u0430\u0434\u0430\u043D\u0438\u044F, \u0432 \u0442\u043E\u043C \u0447\u0438\u0441\u043B\u0435 \u0440\u0430\u0431\u043E\u0442\u044B \u041A\u0440\u0438\u0441\u0442\u0438\u043D \u041D\u0435\u0444\u0444, \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442 \u043E\u0431\u0440\u0430\u0442\u043D\u043E\u0435: \u0441\u0430\u043C\u043E\u043A\u0440\u0438\u0442\u0438\u043A\u0430 \u043F\u043E\u0441\u043B\u0435 \xAB\u043D\u0430\u0440\u0443\u0448\u0435\u043D\u0438\u044F\xBB \u0447\u0430\u0449\u0435 \u043F\u043E\u0434\u043F\u0438\u0442\u044B\u0432\u0430\u0435\u0442 \u043F\u0435\u0440\u0435\u0435\u0434\u0430\u043D\u0438\u0435, \u0430 \u0434\u043E\u0431\u0440\u043E\u0442\u0430 \u043A \u0441\u0435\u0431\u0435 \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u0432\u044B\u0439\u0442\u0438 \u0438\u0437 \u043A\u0440\u0443\u0433\u0430.","\u0414\u043E\u0431\u0440\u043E\u0442\u0430 \u2014 \u043D\u0435 \u0432\u0441\u0435\u0434\u043E\u0437\u0432\u043E\u043B\u0435\u043D\u043D\u043E\u0441\u0442\u044C. \u042D\u0442\u043E \u043F\u0440\u0438\u0437\u043D\u0430\u043D\u0438\u0435: \xAB\u043C\u043D\u0435 \u0441\u0435\u0439\u0447\u0430\u0441 \u0442\u0440\u0443\u0434\u043D\u043E, \u0438 \u044D\u0442\u043E \u043F\u043E-\u0447\u0435\u043B\u043E\u0432\u0435\u0447\u0435\u0441\u043A\u0438 \u043F\u043E\u043D\u044F\u0442\u043D\u043E\xBB.","\u041F\u0440\u043E\u0441\u0442\u043E\u0439 \u0432\u043E\u043F\u0440\u043E\u0441: \u0447\u0442\u043E \u0431\u044B \u044F \u0441\u043A\u0430\u0437\u0430\u043B\u0430 \u0431\u043B\u0438\u0437\u043A\u043E\u0439 \u043F\u043E\u0434\u0440\u0443\u0433\u0435 \u0432 \u0442\u0430\u043A\u043E\u0439 \u0436\u0435 \u0441\u0438\u0442\u0443\u0430\u0446\u0438\u0438?"]},{id:"wave",title:"\u0412\u043E\u043B\u043D\u0430 \u0442\u044F\u0433\u0438",body:["\u041F\u0440\u0430\u043A\u0442\u0438\u043A\u0430 urge surfing \u043F\u0440\u0438\u0448\u043B\u0430 \u0438\u0437 \u0434\u0438\u0430\u043B\u0435\u043A\u0442\u0438\u043A\u043E-\u043F\u043E\u0432\u0435\u0434\u0435\u043D\u0447\u0435\u0441\u043A\u043E\u0439 \u0442\u0435\u0440\u0430\u043F\u0438\u0438. \u0422\u044F\u0433\u0430 \u0432 \u043D\u0435\u0439 \u2014 \u0432\u043E\u043B\u043D\u0430: \u043E\u043D\u0430 \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442\u0441\u044F, \u0434\u043E\u0445\u043E\u0434\u0438\u0442 \u0434\u043E \u043F\u0438\u043A\u0430 \u0438 \u0441\u043F\u0430\u0434\u0430\u0435\u0442, \u0434\u0430\u0436\u0435 \u0435\u0441\u043B\u0438 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0434\u0435\u043B\u0430\u0442\u044C.","\u0417\u0430\u0434\u0430\u0447\u0430 \u043D\u0435 \u0431\u043E\u0440\u043E\u0442\u044C\u0441\u044F \u0438 \u043D\u0435 \u043F\u043E\u0434\u0434\u0430\u0432\u0430\u0442\u044C\u0441\u044F, \u0430 \u043D\u0430\u0431\u043B\u044E\u0434\u0430\u0442\u044C \u043E\u0449\u0443\u0449\u0435\u043D\u0438\u044F \u0432 \u0442\u0435\u043B\u0435, \u043F\u043E\u043A\u0430 \u0432\u043E\u043B\u043D\u0430 \u043C\u0435\u043D\u044F\u0435\u0442\u0441\u044F.","\u041F\u043E\u043F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C \u043C\u043E\u0436\u043D\u043E \u0432 \xAB\u041F\u0430\u0443\u0437\u0435\xBB \u2014 \u0442\u0430\u043C \u0435\u0441\u0442\u044C \u0442\u0430\u0439\u043C\u0435\u0440."]},{id:"halt",title:"HALT: \u0447\u0435\u0442\u044B\u0440\u0435 \u0441\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u044F",body:["HALT \u2014 \u0441\u043E\u043A\u0440\u0430\u0449\u0435\u043D\u0438\u0435 \u043E\u0442 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u0438\u0445 \u0441\u043B\u043E\u0432: \u0433\u043E\u043B\u043E\u0434\u043D\u0430, \u0437\u043B\u044E\u0441\u044C, \u043E\u0434\u0438\u043D\u043E\u043A\u043E, \u0443\u0441\u0442\u0430\u043B\u0430. \u042D\u0442\u0438 \u0441\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u044F \u043B\u0435\u0433\u043A\u043E \u043F\u0440\u0438\u043D\u044F\u0442\u044C \u0437\u0430 \u0436\u0435\u043B\u0430\u043D\u0438\u0435 \u043F\u043E\u0435\u0441\u0442\u044C.","\u041A\u043E\u0440\u043E\u0442\u043A\u0430\u044F \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430 \u043F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u043F\u043E\u043D\u044F\u0442\u044C, \u0447\u0442\u043E \u043D\u0430 \u0441\u0430\u043C\u043E\u043C \u0434\u0435\u043B\u0435 \u043D\u0443\u0436\u043D\u043E: \u043F\u043E\u0435\u0441\u0442\u044C, \u0432\u044B\u0434\u043E\u0445\u043D\u0443\u0442\u044C, \u043F\u043E\u0433\u043E\u0432\u043E\u0440\u0438\u0442\u044C \u0441 \u043A\u0435\u043C-\u0442\u043E \u0438\u043B\u0438 \u043E\u0442\u0434\u043E\u0445\u043D\u0443\u0442\u044C."]},{id:"mindful",title:"\u041E\u0441\u043E\u0437\u043D\u0430\u043D\u043D\u043E\u0435 \u043F\u0438\u0442\u0430\u043D\u0438\u0435 \u2014 \u043D\u0435 \u0438\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435",body:["\u041E\u0441\u043E\u0437\u043D\u0430\u043D\u043D\u043E\u0435 \u043F\u0438\u0442\u0430\u043D\u0438\u0435 \u2014 \u044D\u0442\u043E \u0432\u043D\u0438\u043C\u0430\u043D\u0438\u0435 \u043A \u0432\u043A\u0443\u0441\u0443, \u0442\u0435\u043C\u043F\u0443, \u0433\u043E\u043B\u043E\u0434\u0443 \u0438 \u0441\u044B\u0442\u043E\u0441\u0442\u0438. \u041F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u044B, \u043F\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0435 \u043D\u0430 \u043D\u0451\u043C, \u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440 MB-EAT \u0414\u0436\u0438\u043D \u041A\u0440\u0438\u0441\u0442\u0435\u043B\u043B\u0435\u0440, \u0438\u0437\u0443\u0447\u0430\u043B\u0438\u0441\u044C \u043F\u0440\u0438 \u043A\u043E\u043C\u043F\u0443\u043B\u044C\u0441\u0438\u0432\u043D\u043E\u043C \u043F\u0435\u0440\u0435\u0435\u0434\u0430\u043D\u0438\u0438 \u0438 \u043F\u043E\u043A\u0430\u0437\u0430\u043B\u0438 \u0445\u043E\u0440\u043E\u0448\u0438\u0435 \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u044B.
